AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: >
  Autonomous Ops Agent Full Stack with HITL (Step Functions + SNS + API Gateway)

Parameters:
  AdminEmail:
    Type: String
    Description: Email address to receive restock approval requests.

  EnvironmentName:
    Type: String
    Default: dev
    Description: Environment name for resource tagging.

  CodeBucketName:
    Type: String
    Description: Existing S3 Bucket where Lambda code zip files are stored.

  GatewayUrl:
      Type: String
      Description: "The MCP Endpoint URL for Bedrock AgentCore Gateway"
    
  ModelId:
    Type: String
    Default: "amazon.nova-pro-v1:0"
    Description: "Bedrock Model ID to be used by Strands Agent"

Resources:

  # 1. DynamoDB Inventory Table
  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AutonomousOpsInventory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: SKU
          AttributeType: S
      KeySchema:
        - AttributeName: SKU
          KeyType: HASH

  # 2. SNS Topic for Human Approvals
  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "Restock Approval Notifications"

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref AdminEmail
      Protocol: "email"
      TopicArn: !Ref ApprovalTopic

  # 3. IAM Role for Lambda Functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AutonomousOpsLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AutonomousOpsPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt InventoryTable.Arn
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: '*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ApprovalTopic
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:InvokeAgent
                  - bedrock:GetAgent
                Resource: '*'

  # 4. Tool Lambda 1: Check Inventory
  CheckInventoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AutonomousOps-CheckInventory
      Runtime: python3.11
      Handler: check_inventory.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref InventoryTable
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: "lambda-code/autoops/check_inventory.zip"


  # 5. HITL Lambda: Trigger Step Functions & Send Email (waitForTaskToken)
  RequestRestockApprovalFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AutonomousOps-RequestRestockApproval
      Runtime: python3.11
      Handler: request_restock_approval.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref RestockApprovalStateMachine
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: "lambda-code/autoops/request_restock_approval.zip"

  # 6. Step Functions Task Lambda: Send Approval Email with TaskToken
  SendApprovalEmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AutonomousOps-SendApprovalEmail
      Runtime: python3.11
      Handler: send_approval_email.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ApprovalTopic
          API_ENDPOINT: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/approval"
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: "lambda-code/autoops/send_approval_email.zip"

  # 7. Post-Approval Lambda: Execute Restock
  ProcessRestockFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AutonomousOps-ProcessRestock
      Runtime: python3.11
      Handler: process_restock.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref InventoryTable
          SENDER_EMAIL: 'whiteholekong@gmail.com'
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: "lambda-code/autoops/process_restock.zip"

  # 8. Post-Rejection Lambda: Handle Rejection
  RejectRestockFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AutonomousOps-RejectRestock
      Runtime: python3.11
      Handler: reject_restock.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: "lambda-code/autoops/reject_restock.zip"

  # 9. Webhook Lambda: Handles Click from Email Link (Approve/Reject)
  ApprovalWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AutonomousOps-ApprovalWebhook
      Runtime: python3.11
      Handler: approval_webhook.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: "lambda-code/autoops/approval_webhook.zip"

  # 10. Webhook Lambda: Handles Click from Email Link (Approve/Reject)
  RunAgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AutonomousOps-RunAgent
      Runtime: python3.12
      Timeout: 30
      Handler: run_agent.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          GATEWAY_URL: !Ref GatewayUrl
          MODEL_ID: !Ref ModelId
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: "lambda-code/autoops/run_agent.zip"

  # 11. API Gateway HTTP API for Webhook
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: auto-ops-agent-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['GET','POST']
        AllowHeaders: ['*']

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /approval'
      Target: !Join ['/', ['integrations', !Ref ApiIntegration]]

  RunAgentApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /chat'
      Target: !Join ['/', ['integrations', !Ref RunAgentApiIntegration]]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApprovalWebhookFunction.Arn
      PayloadFormatVersion: '2.0'

  WebhookLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApprovalWebhookFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  RunAgentApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RunAgentFunction.Arn
      PayloadFormatVersion: '2.0'

  RunAgentLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RunAgentFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # 12. IAM Role for Step Functions
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AutonomousOpsSFNRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: '*'

  # 13. Step Functions State Machine (HITL Workflow)
  RestockApprovalStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: AutonomousOps-RestockApprovalWorkflow
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Human-in-the-Loop Approval Workflow",
          "StartAt": "SendApprovalEmail",
          "States": {
            "SendApprovalEmail": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
              "Parameters": {
                "FunctionName": "${SendApprovalEmailFunction.Arn}",
                "Payload": {
                  "sku.$": "$.sku",
                  "quantity.$": "$.quantity",
                  "taskToken.$": "$$.Task.Token"
                }
              },
              "Next": "ProcessRestock",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "RejectRestock"
                }
              ]
            },
            "ProcessRestock": {
              "Type": "Task",
              "Resource": "${ProcessRestockFunction.Arn}",
              "End": true
            },
            "RejectRestock": {
              "Type": "Task",
              "Resource": "${RejectRestockFunction.Arn}",
              "End": true
            }
          }
        }

Outputs:
  WebhookUrl:
    Description: API Gateway Webhook URL for Approvals
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/approval'

  CheckInventoryId:
    Description: CheckInventoryFunction ID
    Value: !Ref CheckInventoryFunction
    Export:
      Name: AutoOpsCheckInventoryFunctionId

  CheckInventoryArn:
    Description: CheckInventoryFunction ARN
    Value: !GetAtt CheckInventoryFunction.Arn
    Export:
      Name: AutoOpsCheckInventoryFunctionArn

  RequestApprovalId:
    Description: RequestRestockApprovalFunction ID
    Value: !Ref RequestRestockApprovalFunction
    Export:
      Name: AutoOpsRequestRestockApprovalFunctionId

  RequestApprovaArn:
    Description: RequestRestockApprovalFunction ARN
    Value: !GetAtt RequestRestockApprovalFunction.Arn
    Export:
      Name: AutoOpsRequestRestockApprovalFunctionArn
